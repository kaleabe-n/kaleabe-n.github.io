  <style>
    /* General Page Styling */
    html,
    body {
      background-color: rgb(4, 20, 33);
      height: 100%;
      margin: 0;
      font-family: sans-serif;
    }

    /* Loading Spinner Styles */
    .loading {
      background-color: rgb(4, 20, 33);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loader {
      width: 90px;
      height: 14px;
      box-shadow: 0 3px 0 #fff;
      position: relative;
      clip-path: inset(-40px 0 -5px);
    }

    .loader:before {
      content: "";
      position: absolute;
      inset: auto calc(50% - 17px) 0;
      height: 50px;
      --g: no-repeat linear-gradient(rgb(134, 185, 176) 0 0);
      background: var(--g), var(--g), var(--g), var(--g);
      background-size: 16px 14px;
      animation: l7-1 2s infinite linear, l7-2 2s infinite linear;
    }

    @keyframes l7-1 {

      0%,
      100% {
        background-position: 0 -50px, 100% -50px
      }

      17.5% {
        background-position: 0 100%, 100% -50px, 0 -50px, 100% -50px
      }

      35% {
        background-position: 0 100%, 100% 100%, 0 -50px, 100% -50px
      }

      52.5% {
        background-position: 0 100%, 100% 100%, 0 calc(100% - 16px), 100% -50px
      }

      70%,
      98% {
        background-position: 0 100%, 100% 100%, 0 calc(100% - 16px), 100% calc(100% - 16px)
      }
    }

    @keyframes l7-2 {

      0%,
      70% {
        transform: translate(0)
      }

      100% {
        transform: translate(200%)
      }
    }
  </style>
</head>

<body>
  <div class="loading">
    <div class="loader"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
